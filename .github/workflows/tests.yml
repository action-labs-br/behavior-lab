name: tests

on:
  push:
  pull_request:

jobs:
  cross-platform:
    defaults:
      run:
        working-directory: projects/behavior-cloning-game
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      SDL_VIDEODRIVER: dummy
      PYGAME_HIDE_SUPPORT_PROMPT: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: projects/behavior-cloning-game/pyproject.toml
      - name: Install project
        run: python -m pip install -e ".[dev]"
      - name: Check dependencies
        run: python -m pip check
      - name: Check command
        run: python -m behavior_cloning_game --help
      - name: Run tests
        run: python -m pytest
      - name: Lint
        run: python -m ruff check behavior_cloning_game tests

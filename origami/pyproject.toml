[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "origami-bc"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "jinja2>=3.1,<4",
  "itsdangerous>=2.2,<3", "python-multipart>=0.0.18,<1",
  "pillow>=11,<13", "pyyaml>=6,<7", "numpy>=2,<3",
  "scikit-learn>=1.6,<2", "joblib>=1.4,<2", "boto3>=1.35,<2",
]

[project.optional-dependencies]
ml = ["torch>=2.6,<3", "torchvision>=0.21,<1"]
test = ["pytest>=8,<10", "httpx>=0.28,<1", "moto[s3,dynamodb]>=5,<6"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

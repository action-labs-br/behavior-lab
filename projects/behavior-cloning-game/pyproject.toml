[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "behavior-cloning-game"
version = "0.1.0"
description = "A beginner-friendly game for learning behavior cloning"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
  "pygame>=2.5",
  "torch>=2.2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
behavior-cloning-game = "behavior_cloning_game.cli:main"

[tool.setuptools.packages.find]
include = ["behavior_cloning_game*", "game*"]

[tool.pytest.ini_options]
testpaths = ["game/tests", "tests"]
pythonpath = ["game"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
